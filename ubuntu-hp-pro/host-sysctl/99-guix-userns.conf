# Guix sandboxes (Epiphany/WebKit, etc.) on Ubuntu foreign distro
# =============================================================================
# Symptom:
#   bwrap: setting up uid map: Permission denied
#   Failed to fully launch dbus-proxy
#   epiphany: trace trap (core dumped)
#
# Root cause (Ubuntu 24.04+ / 26.04):
#   kernel.apparmor_restrict_unprivileged_userns=1
#   AppArmor only ships a working userns profile for *host* /usr/bin/bwrap.
#   Guix apps call /gnu/store/*-bubblewrap-*/bin/bwrap → not covered → denied.
#
# This drop-in disables that AppArmor gate (personal laptop trade-off).
# Runtime-only sysctl -w is lost on reboot; this file survives reboot.
#
# Install once (needs root) — prefer the pack script:
#   ./scripts/install-host-sysctl.sh
#   # or: ./scripts/30-browser-prereqs.sh  (bootstrap step)
#
# Manual:
#   sudo cp host-sysctl/99-guix-userns.conf /etc/sysctl.d/
#   sudo sysctl -p /etc/sysctl.d/99-guix-userns.conf
#   cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns   # must be 0
#
# Also used by: ubuntu-len-yog-AMD64 (same content). Keep both packs in sync.
# =============================================================================
kernel.apparmor_restrict_unprivileged_userns=0
