name: Qimono Lobby static checks

on:
  push:
    paths:
      - 'lobby-files/**'
      - '.github/workflows/qimono-lobby-checks.yml'
  pull_request:
    paths:
      - 'lobby-files/**'
      - '.github/workflows/qimono-lobby-checks.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in lobby-files/*.sh; do
            echo "bash -n $file"
            bash -n "$file"
          done
      - name: Run ShellCheck on deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in lobby-files/*.sh; do
            echo "shellcheck $file"
            shellcheck --severity=warning "$file"
          done
      - name: Check Scheme reader syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq guile-3.0
          for file in lobby-files/*.scm; do
            echo "guile reader: $file"
            guile -c '(let ((path (cadr (command-line))))
                        (call-with-input-file path
                          (lambda (port)
                            (let loop ((form (read port)))
                              (unless (eof-object? form)
                                (loop (read port)))))))' "$file"
          done
