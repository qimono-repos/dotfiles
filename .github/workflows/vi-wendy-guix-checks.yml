name: vi-wendy Guix installer checks

on:
  push:
    paths:
      - 'fedora/vi-wendy/guix/**'
      - '.github/workflows/vi-wendy-guix-checks.yml'
  pull_request:
    paths:
      - 'fedora/vi-wendy/guix/**'
      - '.github/workflows/vi-wendy-guix-checks.yml'

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax and lint
        run: |
          set -euo pipefail
          bash -n fedora/vi-wendy/guix/install-guix.sh
          shellcheck --severity=warning fedora/vi-wendy/guix/install-guix.sh
      - name: Check both installer channel manifests use a direct Guix URL
        run: |
          set -euo pipefail
          for file in fedora/vi-wendy/guix/channels.scm lobby-files/channels-nonguix.scm; do
            grep -Fq 'https://codeberg.org/guix/guix.git' "$file"
            grep -Fq '(inherit upstream-channel)' "$file"
            grep -Fq '897c1a470da759236cc11798f4e0a5f7d4d59fbc' "$file"
          done
      - name: Smoke-test current Guix Git endpoint without redirects
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 75 git -c http.followRedirects=false ls-remote \
            https://codeberg.org/guix/guix.git HEAD
      - name: Scheme reader syntax
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq guile-3.0
          for scm in fedora/vi-wendy/guix/*.scm; do
            guile -c '(call-with-input-file (cadr (command-line))
              (lambda (port)
                (let loop ((form (read port)))
                  (unless (eof-object? form)
                    (loop (read port))))))' "$scm"
          done
      - name: Assert deployed user, hostname, and window manager agree
        run: |
          set -euo pipefail
          config=fedora/vi-wendy/guix/config.scm
          script=fedora/vi-wendy/guix/install-guix.sh
          grep -Fq '(host-name "Qimono")' "$config"
          grep -Fq '(name "qi")' "$config"
          grep -Fq 'stumpwm' "$config"
          grep -Fq 'slim-service-type' "$config"
          grep -Fq 'QIMONO-VI-WENDY-CONFIG-VERSION:' "$config"
          grep -Fq '(host-name "Qimono")' "$script"
          grep -Fq '(name "qi")' "$script"
      - name: Assert authenticated channel bootstrap runs before disk partitioning
        run: |
          set -euo pipefail
          script=fedora/vi-wendy/guix/install-guix.sh
          channels=fedora/vi-wendy/guix/channels.scm
          grep -Fq 'guix pull --channels="$CHANNEL"' "$script"
          grep -Fq 'GUIX_CURRENT=/root/.config/guix/current/bin/guix' "$script"
          grep -Fq 'QIMONO_PREFLIGHT_ONLY' "$script"
          grep -Fq "897c1a470da759236cc11798f4e0a5f7d4d59fbc" "$channels"
          grep -Fq 'https://codeberg.org/guix/guix.git' "$channels"
          grep -Fq 'inherit upstream-channel' "$channels"
          grep -Fq 'SCRIPT_DIR=' "$script"
          grep -Fq 'Using versioned files from local Git checkout' "$script"
          # The first destructive disk operation must appear after Guix evaluation.
          python3 - <<'PY'
          from pathlib import Path
          s = Path("fedora/vi-wendy/guix/install-guix.sh").read_text()
          assert s.index("guix pull --channels=") < s.index("guix system build --dry-run")
          assert s.index("guix system build --dry-run") < s.index('wipefs -a "$DISK"')
          PY
