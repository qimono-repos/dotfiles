# Guix WebKit / Epiphany (and similar bwrap sandboxes) on Ubuntu
# Without this, unprivileged user namespaces are restricted by AppArmor and
# Epiphany dies with: bwrap: setting up uid map: Permission denied
#
# Install (once, needs root):
#   sudo cp host-sysctl/99-guix-userns.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# Or: ./scripts/setup-guix-browser-prereqs.sh
kernel.apparmor_restrict_unprivileged_userns=0
