[project]
name = "llm-quantum-sandbox"
version = "0.1.0"
description = "Quantum-ready sandbox for testing LLM-generated snippets: Qiskit + PennyLane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # IBM's suggested learning stack (quantum.cloud.ibm.com docs)
    "qiskit>=1.2",
    "qiskit-ibm-runtime>=0.30",
    "qiskit-aer>=0.14",
    "qiskit[visualization]>=1.2",
    "numpy>=1.26",
    "pylatexenc>=2.10",
    # PennyLane: hybrid / quantum machine learning side
    "pennylane>=0.38",
]

[tool.uv]
package = false
