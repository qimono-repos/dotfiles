# Keyboard & Console Font Configuration
# Installed to /etc/vconsole.conf by scripts/install-vconsole.sh
# Fonts: Lat2-TerminusBold (Latin-2 + box drawing + bold)
#
# Font names are from /usr/share/consolefonts/
# Format: Lat2-Terminus{Bold}{Size}
# Sizes available: 12x6, 14, 16, 18x10, 20x10, 22x11, 24x12, 28x14, 32x16
#
# Reference: CaskaydiaCove Nerd Font Mono 16 at 1920x1080 ≈ 120 cols x 67 rows
# Lat2-TerminusBold32x16 at 1920x1080 ≈ 120 cols x 67 rows (matching feel)

KEYMAP=us
FONT=Lat2-TerminusBold32x16
