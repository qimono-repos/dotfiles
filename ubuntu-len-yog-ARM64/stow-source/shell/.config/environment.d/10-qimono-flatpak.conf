# GNOME / systemd user session (does not read ~/.zshrc).
# Foreign-distro: Guix flatpak client + Ubuntu-blessed bwrap + Guix GUI
# apps (ghostty, blender, vscodium, gimp, ...).
# See ubuntu-mini-pc/docs/flatpak-guix.md
FLATPAK_BWRAP=/usr/bin/bwrap

# Flatpak export dirs and Guix share must be visible to the SESSION
# bus/manager, not just interactive shells (10-guix.zsh only fixes
# shells). Without these, every tile-launched login shell prints the
# "directories not in XDG_DATA_DIRS" note, and Guix-installed .desktop
# files (ghostty, blender, ...) stay invisible to the GNOME overview /
# Super search and their icons never resolve.
#
# TRAP (2026-08-21 login loop): ${XDG_DATA_DIRS} expands to EMPTY here —
# environment.d runs before pam/gnome-session populate it. An "append" is
# really a replace-and-wipe: /usr/share vanished, GLib found no GSettings
# schemas, gnome-session-manager aborted on every login ("No GSettings
# schemas are installed on the system" → core dump → GDM loop).
# So this list must be ABSOLUTE and self-contained.
XDG_DATA_DIRS=${HOME}/.guix-profile/share:/usr/local/share:/usr/share:/var/lib/snapd/desktop:/var/lib/flatpak/exports/share:${HOME}/.local/share/flatpak/exports/share
