# vconsole.conf for ubuntu-len-yog-ARM64 (Snapdragon Yoga)
# Bare TTY consoles (Ctrl+Alt+F2/F3...) use Linux bitmap fonts. Caskaydia Cove
# Nerd Font is for GUI (Ghostty), NOT the TTY. Closest matching TTY font is
# Terminus Bold (see console-font-resize.sh --apply for auto-sizing).
# Installed/applied by scripts/install-vconsole.sh (sudo).

KEYMAP="us"
FONT="Lat2-TerminusBold32x16"
FONT_MAP=""
