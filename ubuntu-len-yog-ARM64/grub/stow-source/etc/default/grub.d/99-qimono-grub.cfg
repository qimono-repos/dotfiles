# GRUB config override — Qimono diagonal-back (ubuntu-len-yog-ARM64)
# Drop-in for /etc/default/grub.d/
# Applied via: sudo cp to /etc/default/grub.d/99-qimono-grub.cfg, then:
#   sudo update-grub
#
# Adds the dual-boot Windows (os-prober) auto-detection + a visible picker.
# NOTE: Ubuntu ships os-prober effectively disabled even when the inline flag
# is commented-out; we override it here and it takes effect on this aarch64.

# Show the menu (grub-optimizer equivalent defaults)
GRUB_DEFAULT=0                     # index 0 = first entry (Ubuntu) by default
GRUB_TIMEOUT_STYLE=menu            # force a visible menu (was: hidden)
GRUB_TIMEOUT=8                     # 8s picker before booting default

GRUB_DISTRIBUTOR=`( . /etc/os-release && echo ${NAME} )`

# Keep the Snapdragon console output (quiet splash boots Ubuntu silently)
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash console=tty0"
GRUB_CMDLINE_LINUX=""

# Enable third-party OS detection (Windows 11 lives on nvme0n1p3, BitLocker)
GRUB_DISABLE_OS_PROBER=false

# Keep Windows auto-detected at the END of the menu, after Ubuntu entries
GRUB_DISABLE_SUBMENU=y

# NOTE on aarch64, `grub-optimizer` is not packaged (neither Guix nor apt in
# 26.04). This file mirrors exactly what grub-optimizer exposes, written by
# hand. Re-run `sudo update-grub` after editing.
