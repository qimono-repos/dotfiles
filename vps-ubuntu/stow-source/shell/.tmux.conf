# Persistent, low-noise tmux defaults for a one-vCPU VPS.
# Detach with the default prefix (Ctrl-b), then reconnect with `tmux attach`.
set -g history-limit 20000
set -g escape-time 10
set -g focus-events on
set -g mouse on
set -g renumber-windows on
set -g set-clipboard off
set -g status-position top
set -g status-interval 10
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=#89b4fa,bold] #S #[default]'
set -g status-right '#[fg=#a6e3a1]%Y-%m-%d %H:%M #[fg=#cba6f7]#(hostname -s) #[default]'
set -g window-status-current-format '#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W #[default]'
set -g window-status-format '#[fg=#cdd6f4] #I:#W #[default]'
set -g message-style 'fg=#cdd6f4,bg=#313244'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
